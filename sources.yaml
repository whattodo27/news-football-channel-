# Candidate football RSS feeds for the first VPS validation.
# Eight feeds that returned parseable entries in the first VPS check are
# enabled for the one-week pilot. This is only a one-time availability pass;
# review their ongoing health and editorial value after the pilot week.
# trust_tier is evidence quality, not a guarantee for every topic:
# official = primary only for that body's own decisions/results;
# established = established newsroom; specialist = specialist publication;
# aggregator = discovery only, never an independent confirmation;
# unrated = do not use as an auto-publication confirmation until reviewed.
# source_priority is only a source-level tie-breaker. Per-story news_priority
# must be computed separately from event type/tournament and stored on stories.
sources:
  - id: bbc_football
    name: BBC Sport Football
    url: https://feeds.bbci.co.uk/sport/football/rss.xml
    language: en
    publisher: BBC
    independence_group: bbc
    source_type: editorial
    scope: association_football
    tournaments: [all_football]
    trust_tier: established
    source_priority: 8
    enabled: true

