interesting_news:
  # Верхний предел за календарный день по московскому времени.
  daily_limit: 2
  # Минимальная оценка интересности для редакционной очереди.
  min_interest_score: 7
  # Одного доверенного издателя достаточно только для ручной редакционной очереди.
  min_independent_publishers: 1

relevance:
  # Минимальный relevance_score чтобы считать событие футбольным без ручной проверки.
  football_min_score: 0.70
  # При relevance=not_football и score не ниже этого порога — авто-skip.
  not_football_auto_skip: 0.92

match_results:
  # Одно доверенное подтверждение: в текущем наборе каждая лига покрыта одним надёжным
  # источником (MARCA, Gazzetta, RMC, Bundesliga и т.д.), поэтому требование двух
  # независимых издателей блокировало публикацию всех результатов матчей.
  min_independent_publishers: 1
  # selected: результаты только из выбранных крупных соревнований.
  # tournament: выбранные соревнования плюс все матчи активного турнира.
  mode: selected
