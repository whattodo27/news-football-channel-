services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: newsbot-app
    environment:
      NEWSBOT_SOURCES: /app/sources.yaml
      NEWSBOT_EDITORIAL_CONFIG: /app/editorial.yaml
      NEWSBOT_DATA_DIR: /data
      NEWSBOT_DB: /data/newsbot.sqlite3
      NEWSBOT_POLL_SECONDS: ${NEWSBOT_POLL_SECONDS:-3600}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_REVIEW_CHAT_ID: ${TELEGRAM_REVIEW_CHAT_ID:-}
      FILTER_MODEL: ${FILTER_MODEL:-openai/gpt-oss-120b}
      VISION_MODEL: ${VISION_MODEL:-qwen/qwen3.8-27b}
      NEWSBOT_RAW_RETENTION_DAYS: ${NEWSBOT_RAW_RETENTION_DAYS:-30}
      NEWSBOT_IMAGE_RETENTION_DAYS: ${NEWSBOT_IMAGE_RETENTION_DAYS:-30}
      NEWSBOT_AUTOPUBLISH_ENABLED: ${NEWSBOT_AUTOPUBLISH_ENABLED:-true}
      NEWSBOT_AUTOPUBLISH_DAILY_LIMIT: ${NEWSBOT_AUTOPUBLISH_DAILY_LIMIT:-}
    volumes:
      - newsbot_data:/data
      - ./asset_import:/imports:ro
      - ./assets/logos:/logos:ro
    restart: unless-stopped
    mem_limit: 256m

volumes:
  newsbot_data:
